<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量处理 - Lens Drawing</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
/* Batch table editor specific styles */
.batch-editor { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.editor-toolbar { display: flex; gap: 8px; padding: 12px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-light); align-items: center; }
.editor-toolbar .spacer { flex: 1; }
.editor-table-wrap { flex: 1; overflow: auto; background: var(--bg-secondary); }
.editor-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.editor-table th { background: var(--bg-tertiary); color: var(--text-secondary); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--border-medium); position: sticky; top: 0; z-index: 5; white-space: nowrap; }
.editor-table td { padding: 4px 6px; border-bottom: 1px solid var(--divider); }
.editor-table td input { width: 100%; padding: 4px 6px; border: 1px solid transparent; border-radius: 4px; background: transparent; font-size: 12px; color: var(--text-primary); }
.editor-table td input:focus { background: #fff; border-color: var(--accent-border); box-shadow: 0 0 0 2px var(--accent-light); }
.editor-table tr:hover td { background: rgba(22,93,255,0.02); }
.editor-table tr:hover td input { background: rgba(255,255,255,0.5); }
.editor-table .col-part { min-width: 100px; }
.editor-table .col-num { min-width: 55px; }
.editor-table .col-type { min-width: 60px; text-align: center; }
.editor-table .col-actions { width: 60px; text-align: center; }
.btn-row { padding: 4px; border-radius: 4px; color: var(--text-tertiary); cursor: pointer; }
.btn-row:hover { background: #ffebee; color: #c62828; }
.add-row-bar { display: flex; align-items: center; justify-content: center; padding: 12px; gap: 8px; color: var(--text-tertiary); font-size: 13px; cursor: pointer; border-top: 1px dashed var(--border-light); }
.add-row-bar:hover { color: var(--accent); background: var(--accent-light); }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-tertiary); }
.empty-state svg { margin-bottom: 12px; }
.tab-bar { display: flex; gap: 4px; padding: 0 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-light); }
.tab-btn { padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--text-secondary); border-bottom: 2px solid transparent; cursor: pointer; background: none; }
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.tab-panel.active { display: flex; }
.import-panel { padding: 20px; }
.proc-modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
}
.proc-modal-grid .param-row { gap: 6px; margin-bottom: 4px; }
/* Draw iframe overlay */
.draw-overlay {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column;
  background: rgba(0,0,0,0.5);
}
.draw-overlay-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-medium);
  z-index: 1001; flex-shrink: 0;
}
.draw-overlay-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
#draw-iframe { flex: 1; width: 100%; border: none; }
</style>
</head>
<body class="workspace">

<!-- Top Bar -->
<header class="topbar">
  <a href="/" class="back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span>返回</span>
  </a>
  <h2 class="page-title">批量处理</h2>
  <div class="topbar-actions">
    <button class="btn-icon" id="btn-export-all" title="批量导出PDF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </div>
</header>

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="editor">表格编辑</button>
  <button class="tab-btn" data-tab="import">Excel/CSV 导入</button>
</div>

<!-- Editor Panel -->
<div class="tab-panel active" id="panel-editor">
  <div class="editor-toolbar">
    <button class="btn-primary" id="btn-add-row">+ 添加镜片</button>
    <button class="btn-secondary" id="btn-clear-rows">清空</button>
    <button class="btn-secondary" id="btn-export-template" title="下载CSV模板">导出模板</button>
    <div class="spacer"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-right:12px;">
      <label style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">存档 PDF:</label>
      <input type="text" id="global-save-folder" value="DTCA110-36" data-default="Save PDF" style="width:120px;padding:4px 8px;border-radius:4px;border:1px solid var(--border-medium);font-size:12px;background:var(--bg-tertiary);color:var(--text-primary);">
      <label style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">编码 PDF:</label>
      <input type="text" id="global-mfr-folder" value="A11036" data-default="Mfr PDF" style="width:120px;padding:4px 8px;border-radius:4px;border:1px solid var(--border-medium);font-size:12px;background:var(--bg-tertiary);color:var(--text-primary);">
      <label style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">料号:</label>
      <input type="text" id="global-partno-base" value="" placeholder="105.2.00599" style="width:130px;padding:4px 8px;border-radius:4px;border:1px solid var(--border-medium);font-size:12px;background:var(--bg-tertiary);color:var(--text-primary);">
    </div>
    <span class="batch-info" id="editor-info">0 条记录</span>
  </div>
  <div class="editor-table-wrap">
    <table class="editor-table" id="editor-table">
      <thead>
        <tr>
          <th class="col-part">PartName</th>
          <th class="col-part">PartNo</th>
          <th class="col-part">Glass1</th>
          <th class="col-part">Glass2</th>
          <th class="col-part">Glass3</th>
          <th class="col-num">T1</th>
          <th class="col-num">T2</th>
          <th class="col-num">T3</th>
          <th class="col-num">R1</th>
          <th class="col-num">R2</th>
          <th class="col-num">R3</th>
          <th class="col-num">R4</th>
          <th class="col-num">MD1</th>
          <th class="col-num">MD2</th>
          <th class="col-num">MD3</th>
          <th class="col-num">AD1</th>
          <th class="col-num">AD2</th>
          <th class="col-num">AD3</th>
          <th class="col-num">AD4</th>
          <th class="col-proc">加工</th>
          <th class="col-type">类型</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="editor-body"></tbody>
    </table>
    <div class="add-row-bar" id="add-row-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>点击添加新镜片记录</span>
    </div>
  </div>
</div>

<!-- Import Panel -->
<div class="tab-panel" id="panel-import">
  <div class="import-panel">
    <div class="upload-zone" id="upload-zone">
      <div class="upload-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="upload-title">点击或拖拽上传 Excel / CSV</div>
      <div class="upload-hint">支持 .xlsx、.xls、.csv 格式，自动识别单片 / 双胶合 / 三胶合</div>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none;">
    </div>
    <div class="batch-toolbar" id="import-toolbar" style="display:none; margin-top:16px;">
      <div class="batch-info">导入 <strong id="import-count">0</strong> 条</div>
      <button class="btn-primary" id="btn-import-to-editor">导入到编辑器</button>
    </div>
    <div class="table-wrap" id="import-table-wrap" style="display:none; margin-top:12px;">
      <table class="data-table">
        <thead><tr><th>#</th><th>Part Name</th><th>Part No</th><th>类型</th><th>玻璃</th><th>T1</th><th>R1</th><th>R2</th><th>MD1</th></tr></thead>
        <tbody id="import-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── Draw Module iframe Overlay ── -->
<div class="draw-overlay" id="draw-overlay" style="display:none;">
  <div class="draw-overlay-bar">
    <span class="draw-overlay-title" id="draw-overlay-title">编辑出图参数</span>
    <div style="display:flex;gap:8px;">
      <button class="btn-secondary" id="btn-draw-cancel">取消</button>
    </div>
  </div>
  <iframe id="draw-iframe" src="about:blank"></iframe>
</div>

<!-- ── 加工要求编辑 Modal ── -->
<div class="modal-overlay" id="proc-modal" style="display:none;">
  <div class="modal" style="max-width:700px; max-height:85vh; overflow-y:auto;">
    <h3 id="proc-modal-title">编辑加工要求</h3>
    <div id="proc-modal-lens-info" style="font-size:11px;color:var(--text-tertiary);margin-bottom:12px;"></div>

    <!-- Card 1: 加工要求 -->
    <div class="param-card" style="margin-bottom:12px;">
      <div class="card-header"><span class="card-title">加工要求</span></div>
      <div class="proc-modal-grid">
        <div class="param-row"><label>单页 C</label><input type="text" id="proc_modal_c" placeholder="60″"></div>
        <div class="param-row"><label>表面瑕疵 B</label><input type="text" id="proc_modal_b" placeholder="60/40"></div>
        <div class="param-row">
          <label>N</label><select id="proc_modal_N_mode"><option value="auto">自动</option><option value="manual">手动</option></select>
        </div>
        <div class="param-row" id="proc-modal-n-manual" style="display:none;"><label>N 值</label><input type="number" step="0.1" id="proc_modal_N_manual" value="1.5"></div>
        <div class="param-row"><label>ΔN</label><input type="text" id="proc_modal_DN" placeholder="0.3"></div>
        <div class="param-row"><label>署名</label><input type="text" id="proc_modal_sig" placeholder="l.y.h"></div>
        <div class="param-row"><label>玻璃品级</label><select id="proc_modal_ranking"><option value="01">01</option><option value="00 ND±0.0003%  VD±0.3%">00 ND±0.0003%  VD±0.3%</option></select></div>
      </div>
    </div>

    <!-- Card 2: 倒角 & CA -->
    <div class="param-card" style="margin-bottom:12px;">
      <div class="card-header"><span class="card-title">倒角 &amp; CA</span></div>
      <div class="proc-modal-grid">
        <div class="param-row"><label>倒角模式</label><select id="proc_modal_ch_mode"><option value="auto">自动</option><option value="manual">手动</option></select></div>
        <div class="param-row" id="proc-modal-ch-left" style="display:none;"><label>左侧倒角</label><input type="number" step="0.05" id="proc_modal_ch_left" value="0.1"></div>
        <div class="param-row" id="proc-modal-ch-right" style="display:none;"><label>右侧倒角</label><input type="number" step="0.05" id="proc_modal_ch_right" value="0.3"></div>
        <div class="param-row"><label>CA 模式</label><select id="proc_modal_ca_mode"><option value="auto">自动</option><option value="manual">手动</option></select></div>
        <div class="param-row" id="proc-modal-ca-ratio"><label>CA 系数</label><input type="number" step="0.01" id="proc_modal_ca_ratio" value="0.98"></div>
        <div class="param-row" id="proc-modal-ca1" style="display:none;"><label>CA1</label><input type="number" step="0.01" id="proc_modal_CA1"></div>
        <div class="param-row" id="proc-modal-ca2" style="display:none;"><label>CA2</label><input type="number" step="0.01" id="proc_modal_CA2"></div>
      </div>
    </div>

    <!-- Card 3: 公差 -->
    <div class="param-card" style="margin-bottom:12px;">
      <div class="card-header"><span class="card-title">公差</span></div>
      <div class="proc-modal-grid">
        <div class="param-row"><label>厚度公差</label><input type="number" step="0.001" id="proc_modal_t_tol" value="0.02"></div>
        <div class="param-row"><label>矢高公差</label><input type="number" step="0.001" id="proc_modal_sag_tol" value="0.02"></div>
        <div class="param-row"><label>定位上偏差</label><input type="number" step="0.001" id="proc_modal_pos_up" value="0.010"></div>
        <div class="param-row"><label>定位下偏差</label><input type="number" step="0.001" id="proc_modal_pos_lo" value="0.025"></div>
        <div class="param-row"><label>非定位上偏差</label><input type="number" step="0.001" id="proc_modal_np_up" value="0.05"></div>
        <div class="param-row"><label>非定位下偏差</label><input type="number" step="0.001" id="proc_modal_np_lo" value="0.10"></div>
        <div class="param-row" id="proc-modal-ref-row" style="display:none;"><label>定位镜片</label><select id="proc_modal_ref"><option value="1">第1片</option><option value="2" selected>第2片</option><option value="3">第3片</option></select></div>
      </div>
    </div>

    <!-- Card 4: 镀膜参数 -->
    <div class="param-card" style="margin-bottom:12px;">
      <div class="card-header"><span class="card-title">镀膜参数</span></div>
      <div class="param-row" style="margin-bottom:8px;">
        <label>预设方案</label>
        <select id="proc_modal_coat_preset">
          <option value="Custom">自定义</option>
          <option value="SQ-A1">SQ-A1</option>
          <option value="SQ-A6">SQ-A6</option>
        </select>
      </div>
      <div class="coat-dual-col">
        <div class="coat-col">
          <div class="coat-col-header">S1</div>
          <div class="coat-field"><label>Wave 1</label><input type="text" id="proc_modal_s1_w1" value="420-680"></div>
          <div class="coat-field"><label>Wave 2</label><input type="text" id="proc_modal_s1_w2" value="850/940"></div>
          <div class="coat-field"><label>Ravg 1</label><input type="text" id="proc_modal_s1_r1" value="0.5"></div>
          <div class="coat-field"><label>Ravg 2</label><input type="text" id="proc_modal_s1_r2" value="1"></div>
          <div class="coat-field"><label>Angle 1</label><input type="text" id="proc_modal_s1_a1" value="0-22"></div>
          <div class="coat-field"><label>Angle 2</label><input type="text" id="proc_modal_s1_a2" value="0-22"></div>
        </div>
        <div class="coat-col">
          <div class="coat-col-header">S2</div>
          <div class="coat-field"><label>Wave 1</label><input type="text" id="proc_modal_s2_w1" value="420-680"></div>
          <div class="coat-field"><label>Wave 2</label><input type="text" id="proc_modal_s2_w2" value="850/940"></div>
          <div class="coat-field"><label>Ravg 1</label><input type="text" id="proc_modal_s2_r1" value="0.5"></div>
          <div class="coat-field"><label>Ravg 2</label><input type="text" id="proc_modal_s2_r2" value="1"></div>
          <div class="coat-field"><label>Angle 1</label><input type="text" id="proc_modal_s2_a1" value="0-22"></div>
          <div class="coat-field"><label>Angle 2</label><input type="text" id="proc_modal_s2_a2" value="0-22"></div>
        </div>
      </div>
    </div>

    <!-- Card 5: 镜片参数（只读） -->
    <div class="param-card" style="margin-bottom:16px; opacity:0.7;">
      <div class="card-header"><span class="card-title">镜片参数（来自表格数据，不可修改）</span></div>
      <div id="proc-modal-lens-readonly"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="btn-proc-reset">恢复默认</button>
      <button class="btn-secondary" id="btn-proc-cancel">取消</button>
      <button class="btn-primary" id="btn-proc-save">保存</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/batch.js') }}"></script>
<script>
// Resize and center workspace window atomically
(function() {
  function tryResize(retries) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.resizeAndCenter) {
      window.pywebview.api.resizeAndCenter(1400, 920);
      return;
    }
    if (retries > 0) setTimeout(() => tryResize(retries - 1), 100);
  }
  tryResize(50);
})();
</script>
</body>
</html>
